name: CI - ESLint + Prettier

on:
  push:
    paths:
      - 'project-eslint-prettier/**'
  pull_request:
    paths:
      - 'project-eslint-prettier/**'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-eslint-prettier

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project-eslint-prettier/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (timed)
        run: |
          echo "## ESLint + Prettier Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          START=$(date +%s%N)
          npm run lint --silent || true
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "| Step | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${ELAPSED}ms |" >> $GITHUB_STEP_SUMMARY
          echo "ESLint completed in ${ELAPSED}ms"

      - name: Run Prettier check (timed)
        run: |
          START=$(date +%s%N)
          npm run format:check --silent || true
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "| Prettier | ${ELAPSED}ms |" >> $GITHUB_STEP_SUMMARY
          echo "Prettier check completed in ${ELAPSED}ms"

      - name: TypeScript type check
        run: npm run typecheck
